[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "budget-aware-product-search"
version = "0.1.0"
description = "Budget-aware product search: lexical/dense retrieval, reranking, adaptive routing, distillation, and C++ serving."
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = {text = "MIT"}
authors = [{name = "Project author"}]
dependencies = [
  "numpy>=1.26,<3",
  "pandas>=2.1,<3",
  "pyarrow>=15,<22",
  "scipy>=1.11,<2",
  "scikit-learn>=1.4,<2",
  "PyYAML>=6,<7",
  "joblib>=1.3,<2",
  "tqdm>=4.66,<5",
]

[project.optional-dependencies]
ml = [
  "torch>=2.2",
  "transformers>=4.45,<6",
  "sentence-transformers>=5.1,<6",
  "datasets>=3,<5",
  "accelerate>=1,<3",
  "faiss-cpu>=1.8,<2",
  "onnx>=1.16,<2",
  "onnxruntime>=1.19,<2",
  "optimum[onnxruntime]>=1.23,<3",
]
dev = [
  "pytest>=8,<10",
  "ruff>=0.8,<1",
  "mypy>=1.11,<2",
]

[project.scripts]
prepare-esci = "budget_aware_search.data:main"
evaluate-ranking = "budget_aware_search.metrics:main"
run-bm25 = "budget_aware_search.baselines.bm25:main"
run-dense = "budget_aware_search.baselines.dense:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
